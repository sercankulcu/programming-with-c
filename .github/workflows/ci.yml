name: build

on: [push, pull_request, workflow_dispatch]

jobs:
  unix:
    name: ${{ matrix.os }} · ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v5
      - name: Portable weeks
        run: sh ci/build.sh PORTABLE
      - name: POSIX weeks
        if: always()
        run: sh ci/build.sh POSIX

  windows:
    name: windows · mingw-w64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc make
      - name: Portable weeks only
        run: sh ci/build.sh PORTABLE

  embedded:
    name: arm-none-eabi · qemu
    runs-on: ubuntu-latest
    env:
      CC: arm-none-eabi-gcc
    steps:
      - uses: actions/checkout@v5
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi qemu-system-arm
      - name: Embedded weeks
        run: sh ci/build.sh EMBEDDED

  qemu:
    name: arm-none-eabi · qemu run
    runs-on: ubuntu-latest
    env:
      CC: arm-none-eabi-gcc
      FREERTOS_TAG: V11.3.3
    steps:
      - uses: actions/checkout@v5
      - name: Install cross toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
          qemu-system-arm --version
      - name: Fetch FreeRTOS-Kernel ${{ env.FREERTOS_TAG }}
        run: git clone --depth 1 --branch "$FREERTOS_TAG" https://github.com/FreeRTOS/FreeRTOS-Kernel.git "$RUNNER_TEMP/FreeRTOS-Kernel"
      - name: Run embedded weeks under QEMU
        run: FREERTOS="$RUNNER_TEMP/FreeRTOS-Kernel" sh ci/qemu.sh
